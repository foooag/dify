# Build and Push API & Web SF
# Converted from .github/workflows/build-push-sf.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "deploy/dev" || $CI_COMMIT_BRANCH == "deploy/enterprise"
      when: always
    - if: $CI_COMMIT_TAG
      when: always
    - when: never

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  # Set DIFY_WEB_IMAGE_NAME / DIFY_API_IMAGE_NAME in GitLab CI/CD variables to override
  DIFY_WEB_IMAGE_NAME: "registry.cn-beijing.aliyuncs.com/sf-service/dify-web"
  DIFY_API_IMAGE_NAME: "registry.cn-beijing.aliyuncs.com/sf-service/dify-api"

# Optional: limit to specific project (GitHub had: github.repository == 'foooag/dify')
# Uncomment and set CI_PROJECT_PATH in rules of each job:
# - if: $CI_PROJECT_PATH == "foooag/dify"

.build_base: &build_base
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - apk add --no-cache curl jq git
    # QEMU for multi-arch (arm64) builds
    - docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true
    - docker buildx create --use --name multiarch || docker buildx use multiarch
    - docker buildx inspect --bootstrap
    - echo "$DOCKERHUB_TOKEN" | docker login registry.cn-beijing.aliyuncs.com -u "$DOCKERHUB_USER" --password-stdin
  retry: 1

build-api-amd64:
  <<: *build_base
  stage: build
  script:
    - export IMAGE_NAME="${DIFY_API_IMAGE_NAME}" COMMIT_SHA="${CI_COMMIT_SHA}"
    - mkdir -p api-amd64
    - |
      docker buildx build
        --platform linux/amd64
        --build-arg "COMMIT_SHA=${COMMIT_SHA}"
        --label "org.opencontainers.image.revision=${COMMIT_SHA}"
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}"
        --output "type=image,name=${IMAGE_NAME},push-by-digest=true,name-canonical=true,push=true"
        --metadata-file api-amd64/meta.json
        --provenance=false --sbom=false
        -f api/Dockerfile
        api/
    - digest=$(jq -r '.["containerimage.digest"] // empty' api-amd64/meta.json) && echo "$digest" > api-amd64/digest
  artifacts:
    paths:
      - api-amd64/
    expire_in: 1 day

build-api-arm64:
  <<: *build_base
  stage: build
  script:
    - export IMAGE_NAME="${DIFY_API_IMAGE_NAME}" COMMIT_SHA="${CI_COMMIT_SHA}"
    - mkdir -p api-arm64
    - |
      docker buildx build
        --platform linux/arm64
        --build-arg "COMMIT_SHA=${COMMIT_SHA}"
        --label "org.opencontainers.image.revision=${COMMIT_SHA}"
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}"
        --output "type=image,name=${IMAGE_NAME},push-by-digest=true,name-canonical=true,push=true"
        --metadata-file api-arm64/meta.json
        --provenance=false --sbom=false
        -f api/Dockerfile
        api/
    - digest=$(jq -r '.["containerimage.digest"] // empty' api-arm64/meta.json) && echo "$digest" > api-arm64/digest
  artifacts:
    paths:
      - api-arm64/
    expire_in: 1 day

build-web-amd64:
  <<: *build_base
  stage: build
  script:
    - export IMAGE_NAME="${DIFY_WEB_IMAGE_NAME}" COMMIT_SHA="${CI_COMMIT_SHA}"
    - mkdir -p web-amd64
    - |
      docker buildx build
        --platform linux/amd64
        --build-arg "COMMIT_SHA=${COMMIT_SHA}"
        --label "org.opencontainers.image.revision=${COMMIT_SHA}"
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}"
        --output "type=image,name=${IMAGE_NAME},push-by-digest=true,name_canonical=true,push=true"
        --metadata-file web-amd64/meta.json
        --provenance=false --sbom=false
        -f web/Dockerfile
        web/
    - digest=$(jq -r '.["containerimage.digest"] // empty' web-amd64/meta.json) && echo "$digest" > web-amd64/digest
  artifacts:
    paths:
      - web-amd64/
    expire_in: 1 day

build-web-arm64:
  <<: *build_base
  stage: build
  script:
    - export IMAGE_NAME="${DIFY_WEB_IMAGE_NAME}" COMMIT_SHA="${CI_COMMIT_SHA}"
    - mkdir -p web-arm64
    - |
      docker buildx build
        --platform linux/arm64
        --build-arg "COMMIT_SHA=${COMMIT_SHA}"
        --label "org.opencontainers.image.revision=${COMMIT_SHA}"
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}"
        --output "type=image,name=${IMAGE_NAME},push-by-digest=true,name-canonical=true,push=true"
        --metadata-file web-arm64/meta.json
        --provenance=false --sbom=false
        -f web/Dockerfile
        web/
    - digest=$(jq -r '.["containerimage.digest"] // empty' web-arm64/meta.json) && echo "$digest" > web-arm64/digest
  artifacts:
    paths:
      - web-arm64/
    expire_in: 1 day

.manifest_base: &manifest_base
  <<: *build_base
  stage: manifest

create-manifest-api:
  <<: *manifest_base
  needs:
    - build-api-amd64
    - build-api-arm64
  script:
    - apk add --no-cache jq
    - echo "$DOCKERHUB_TOKEN" | docker login registry.cn-beijing.aliyuncs.com -u "$DOCKERHUB_USER" --password-stdin
    - export IMAGE_NAME="${DIFY_API_IMAGE_NAME}"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
      fi
    - |
      digest_args="${IMAGE_NAME}@$(cat api-amd64/digest) ${IMAGE_NAME}@$(cat api-arm64/digest)"
      docker buildx imagetools create -t "${IMAGE_NAME}:${IMAGE_TAG}" ${digest_args}
      docker buildx imagetools create -t "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" ${digest_args}
      docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}"

create-manifest-web:
  <<: *manifest_base
  needs:
    - build-web-amd64
    - build-web-arm64
  script:
    - apk add --no-cache jq
    - echo "$DOCKERHUB_TOKEN" | docker login registry.cn-beijing.aliyuncs.com -u "$DOCKERHUB_USER" --password-stdin
    - export IMAGE_NAME="${DIFY_WEB_IMAGE_NAME}"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
      fi
    - |
      digest_args="${IMAGE_NAME}@$(cat web-amd64/digest) ${IMAGE_NAME}@$(cat web-arm64/digest)"
      docker buildx imagetools create -t "${IMAGE_NAME}:${IMAGE_TAG}" ${digest_args}
      docker buildx imagetools create -t "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" ${digest_args}
      docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}"
